schema: 1
id: org.fleet.discord
name: Discord
description: Notify a Discord channel when torrents are added, finished, or removed.
version: 1.0.0
api: ">=1.0.0 <2.0.0"
engines:
  - rtorrent
capabilities:
  - storage.read
  - storage.write
  - torrents.read
  - http.fetch
frontend:
  type: declarative
  entry: ui/extension.json
backend:
  type: process
  executable: bin/discord-worker
  protocol: jsonrpc-2
